name: ams OSRAM
description: 'ams OSRAM (ams-OSRAM AG) is a global leader in innovative optical solutions,
  designing and manufacturing intelligent sensors, emitters, and light-based semiconductors.
  Formed from the 2020 combination of ams AG (Austria) and OSRAM (Germany), the company
  builds LEDs, VCSEL and edge-emitting lasers, CMOS image sensors, ambient light and
  proximity sensors, direct time-of-flight (dToF) sensors, photodiodes, and LED/VCSEL
  driver ICs. Its sensing, illumination, and visualization technologies serve automotive
  and mobility (headlamps, interior lighting, ADAS), industrial automation and robotics,
  medical and healthcare devices, mobile and wearable devices, computing, and general
  lighting. Headquartered in Premstaetten, Austria and Munich, Germany, ams OSRAM
  employs roughly 18,500 people across 25 R&D sites and holds over 12,000 patents.
  This profile was surfaced as a portfolio company of iconiq-capital and enriched
  from ams OSRAM public web pages; the company exposes product/design support and a
  download center rather than a public developer API.'
